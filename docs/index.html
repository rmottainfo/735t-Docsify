<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>735t-Docsify</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- CSS oficial do Docsify v4/v5 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Carregando...</div>
  <script>
    window.$docsify = {
      name: '735t-Docsify',
      repo: 'https://github.com/rmottainfo/735t-Docsify',
      
      // Ativa a barra de navegação superior e a lateral
      // loadNavbar: true,
      loadSidebar: true,
      
      // Habilita fallback de sidebar relativa para subpastas
      autoHeader: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: true,

      // Alias dinâmico correto para a capa
      alias: {
        '/.*/_coverpage.md': '/_coverpage.md'
      },
      
      // Busca integrada
      search: {
        placeholder: 'Pesquisar...',
        noData: 'Nenhum resultado encontrado',
        depth: 3
      }
    }
  </script>
  
  <!-- Core do Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugin de Busca -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
