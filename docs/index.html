<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Documentação do Projeto</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Tema do Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Carregando...</div>
  <script>
window.$docsify = {
  name: '735t-Docsify',
  repo: 'https://github.com/rmottainfo/735t-Docsify',
  loadNavbar: true,
  loadSidebar: true,
  subMaxLevel: 2,
  auto2top: true,
  coverpage: true,
  
  // Configuração multilíngue
  multilanguage: {
    default: 'pt-br',
    languages: ['pt-br', 'en', 'es'],
    labels: {
      'pt-br': 'Português',
      'en': 'English',
      'es': 'Español'
    }
  },
  
  search: {
    placeholder: 'Pesquisar...',
    noData: 'Nenhum resultado encontrado',
    depth: 3
  }
}
  </script>
  
  <!-- Core do Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <!-- Plugin de Busca -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <!-- Plugin de Suporte a Idiomas -->
  <script src="//cdn.jsdelivr.net/npm/docsify-multilanguage-plugin/dist/docsify-multilanguage.min.js"></script>
</body>
</html>
